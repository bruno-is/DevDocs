apiVersion: v1
kind: Namespace
metadata:
  name: devdocs-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: devdocs-lab
spec:
  replicas: 2
  selector:
    matchLabels: { app: echo }
  template:
    metadata:
      labels: { app: echo }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0.0
          args: ["-listen=:5678", "-text=DevDocs local"]
          ports: [{ containerPort: 5678 }]
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          startupProbe:
            httpGet: { path: /, port: 5678 }
            failureThreshold: 15
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /, port: 5678 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 5678 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: devdocs-lab
spec:
  selector: { app: echo }
  ports: [{ port: 80, targetPort: 5678 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-data
  namespace: devdocs-lab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 1Gi }
---
apiVersion: v1
kind: Pod
metadata:
  name: volume-demo
  namespace: devdocs-lab
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: volume-demo
      image: busybox:1.37.0
      command:
        [sh, -c, "test -f /data/marker || date -u > /data/marker; sleep 86400"]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 100m, memory: 32Mi }
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: [ALL] }
      volumeMounts: [{ name: data, mountPath: /data }]
  volumes:
    - name: data
      persistentVolumeClaim: { claimName: demo-data }
